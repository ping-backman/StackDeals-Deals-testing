YAML
name: Refresh StackDeals Curated Deals

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deal aggregator
        env:
          SKIMLINKS_SITE_ID: ${{ secrets.SKIMLINKS_SITE_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          DEALS_DOMAIN: "https://deals.getstackdeals.xyz"
        run: python scripts/fetch_deals.py

      - name: Commit updated deal feeds
        run: |
          git config user.name "StackDeals Bot"
          git config user.email "bot@getstackdeals.xyz"
          git add deals/data/public-deals.json deals/data/vip-deals.json
          git diff --staged --quiet || git commit -m "chore(deals): refresh curated Amazon deals feed"
          git push
